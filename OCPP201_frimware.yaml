active_modules:

  iso15118_charger:
    module: EvseV2G
    config_module:
      device: auto
      tls_security: allow
    connections:
      security:
        - module_id: evse_security
          implementation_id: main

  phyverso_bsp:
    module: PhyVersoBSP
    config_module:
      serial_port: /dev/ttyS6
      baud_rate: 115200
      reset_gpio: -1
      conn1_max_current_A_import: 16
      conn1_min_current_A_import: 6
      conn1_min_phase_count_import: 3
      conn1_max_phase_count_import: 3
      conn1_has_socket: false
      conn1_dc: false
      conn1_motor_lock_type: -1
      conn1_gpio_stop_button_enabled: true
      conn1_gpio_stop_button_bank: gpiochip2
      conn1_gpio_stop_button_pin: 36
      conn2_max_current_A_import: 16
      conn2_min_current_A_import: 6
      conn2_min_phase_count_import: 3
      conn2_max_phase_count_import: 3
      conn2_has_socket: false
      conn2_dc: false
      conn2_motor_lock_type: -1

  # ─────────────────────────────────────────
  # EVSE MANAGERS (CLOUD CONTROLLED)
  # ─────────────────────────────────────────

  evse_manager_1:
    module: EvseManager
    mapping:
      module:
        evse: 1
    config_module:
      connector_id: 1
      evse_id: "1"
      session_logging: true
      request_zero_power_in_idle: true
      external_ready_to_start_charging: true
    connections:
      bsp:
        - module_id: phyverso_bsp
          implementation_id: connector_1
      powermeter_grid_side:                     
        - module_id: powermeter
          implementation_id: main
      slac:
        - module_id: slac
          implementation_id: evse
      hlc:
        - module_id: iso15118_charger
          implementation_id: charger
     

  evse_manager_2:
    module: EvseManager
    mapping:
      module:
        evse: 2
    config_module:
      connector_id: 2
      evse_id: "2"
      session_logging: true
      request_zero_power_in_idle: true
      external_ready_to_start_charging: true

    connections:
      bsp:
        - module_id: phyverso_bsp
          implementation_id: connector_2
      powermeter_grid_side:                   
        - module_id: powermeter
          implementation_id: main
      slac:
        - module_id: slac
          implementation_id: evse
      hlc:
        - module_id: iso15118_charger
          implementation_id: charger
     

  slac:
    module: SlacSimulator

  persistent_store:
    module: PersistentStore

  evse_security:
    module: EvseSecurity
    config_module:
      private_key_password: "123456"
      csms_ca_bundle: /etc/everest/certs/ca/csms/CSMS_ROOT_CA.pem
      csms_leaf_cert_directory: /etc/everest/certs/client/csms
      csms_leaf_key_directory: /etc/everest/certs/client/csms

  # ─────────────────────────────────────────
  # TOKEN PROVIDERS (LOCAL TOKEN GENERATION)
  # ─────────────────────────────────────────

  token_provider_1:
    module: DummyTokenProvider
    config_implementation:
      main:
        timeout: 10
        token: DEADBEEF
    connections:
      evse:
        - module_id: evse_manager_1
          implementation_id: evse

  token_provider_2:
    module: DummyTokenProvider
    config_implementation:
      main:
        timeout: 10
        token: DEADBEEF
    connections:
      evse:
        - module_id: evse_manager_2
          implementation_id: evse

  # ─────────────────────────────────────────
  # AUTH MODULE
  # Token comes from provider
  # Validation happens via OCPP
  # ─────────────────────────────────────────

  auth:
    module: Auth
    config_module:
      connection_timeout: 120
      selection_algorithm: FindFirst

    connections:
      token_provider:
   
        - module_id: token_provider_1
          implementation_id: main
        - module_id: token_provider_2
          implementation_id: main
      
        - module_id: ocpp
          implementation_id: auth_provider

      token_validator:
    
        - module_id: ocpp
          implementation_id: auth_validator

      evse_manager:
        - module_id: evse_manager_1
          implementation_id: evse
        - module_id: evse_manager_2
          implementation_id: evse

  # ─────────────────────────────────────────
  # OCPP MODULE
  # ─────────────────────────────────────────

  ocpp:
    module: OCPP201
    connections:
      evse_manager:
        - module_id: evse_manager_1
          implementation_id: evse
        - module_id: evse_manager_2
          implementation_id: evse
      auth:
        - module_id: auth
          implementation_id: main
      system:
        - module_id: system
          implementation_id: main
      security:
        - module_id: evse_security
          implementation_id: main
      evse_energy_sink:
        - module_id: grid_connection_point
          implementation_id: external_limits
        - module_id: evse_manager_1_ocpp_sink
          implementation_id: external_limits
        - module_id: evse_manager_2_ocpp_sink
          implementation_id: external_limits

  # ─────────────────────────────────────────
  # ENERGY SECTION (Required)
  # ─────────────────────────────────────────

  energy_manager:
    module: EnergyManager
    connections:
      energy_trunk:
        - module_id: grid_connection_point
          implementation_id: energy_grid

  

  evse_manager_1_ocpp_sink:
    module: EnergyNode
    mapping:
      module:
        evse: 1
    config_module:
      fuse_limit_A: 32.0
      phase_count: 3
    connections:
      energy_consumer:
        - module_id: evse_manager_1
          implementation_id: energy_grid

  evse_manager_2_ocpp_sink:
    module: EnergyNode
    mapping:
      module:
        evse: 2
    config_module:
      fuse_limit_A: 32.0
      phase_count: 3
    connections:
      energy_consumer:
        - module_id: evse_manager_2
          implementation_id: energy_grid

  evse_manager_1_api_sink:
    module: EnergyNode
    mapping:
      module:
        evse: 1
    config_module:
      fuse_limit_A: 32.0
      phase_count: 3
    connections:
      energy_consumer:
        - module_id: evse_manager_1_ocpp_sink
          implementation_id: energy_grid

  evse_manager_2_api_sink:
    module: EnergyNode
    mapping:
      module:
        evse: 2
    config_module:
      fuse_limit_A: 32.0
      phase_count: 3
    connections:
      energy_consumer:
        - module_id: evse_manager_2_ocpp_sink
          implementation_id: energy_grid

  grid_connection_point:
    module: EnergyNode
    mapping:
      module:
        evse: 0
    config_module:
      fuse_limit_A: 40.0
      phase_count: 3
    connections:
      price_information: []
      energy_consumer:
        - module_id: evse_manager_1_api_sink
          implementation_id: energy_grid
        - module_id: evse_manager_2_api_sink
          implementation_id: energy_grid

  error_history:
    module: ErrorHistory
    config_implementation:
      error_history:
        database_path: /tmp/error_history.db
  api:
    module: API
    connections:
      evse_manager:
        - module_id: evse_manager_1
          implementation_id: evse
        - module_id: evse_manager_2
          implementation_id: evse
      ocpp:
        - module_id: ocpp
          implementation_id: ocpp_generic
      error_history:
        - module_id: error_history
          implementation_id: error_history
      evse_energy_sink:
        - module_id: evse_manager_1_api_sink
          implementation_id: external_limits
        - module_id: evse_manager_2_api_sink
          implementation_id: external_limits

  serial_comm_hub:
    module: SerialCommHub
    config_implementation:
      main:
        serial_port: /dev/ttyS4
        baudrate: 9600
        rxtx_gpio_line: 44
        rxtx_gpio_chip: gpiochip3
        rxtx_gpio_tx_high: true

  powermeter:
    module: GenericPowermeter
    connections:
      serial_comm_hub:
        - module_id: serial_comm_hub
          implementation_id: main
    config_implementation:
      main:
        model: "Eastron_SDM230"
        powermeter_device_id: 1
  system:
    module: System

x-module-layout: {}
